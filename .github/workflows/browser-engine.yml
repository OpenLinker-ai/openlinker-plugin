name: Browser engine

on:
  pull_request:
    paths:
      - "packages/browser-runtime/browser-engine/**"
      - "packages/browser-runtime/browserprotocol/**"
      - "packages/browser-runtime/browserruntime/**"
      - "packages/browser-runtime/egressgateway/**"
      - "packages/browser-runtime/netpolicy/**"
      - ".github/workflows/browser-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/browser-runtime/browser-engine/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
      - name: Install the pinned Browser engine graph
        working-directory: packages/browser-runtime/browser-engine
        run: npm ci --ignore-scripts
      - name: Type-check and test the Browser engine
        working-directory: packages/browser-runtime/browser-engine
        run: npm run lint && npm test
      - name: Test the Go supervisor contract with the race detector
        run: GOWORK=off go test -race ./packages/browser-runtime/browserprotocol ./packages/browser-runtime/browserruntime
