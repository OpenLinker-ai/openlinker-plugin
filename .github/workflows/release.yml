name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_native:
        description: Publish native packages with the Plugin-owned host (select an immutable Plugin tag)
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  go-module:
    # A Go tag/source release must not depend on a downstream CLI archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:go
      - run: npm run check:go-boundaries
      - run: npm run check:agent-runtime-integration
      - run: GOWORK=off go mod verify
      - run: GOWORK=off go build ./cmd/...

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_native && github.ref_type == 'tag'
    needs: go-module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          npm run release:check
          for host in codex claude; do
            sh -n "platforms/${host}/openlinker/bin/openlinker-plugin"
            sh -n "platforms/${host}/openlinker/scripts/resolve-openlinker-cli"
            sh -n "platforms/${host}/openlinker/scripts/install-openlinker-cli"
            node --check "platforms/${host}/openlinker/scripts/install-openlinker-cli.mjs"
          done
          node --check scripts/generate-cli-lock.mjs

      - name: Package plugin and standalone Skills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          runtime_package_root="${RUNNER_TEMP}/openlinker-agent-runtime"
          node scripts/build-agent-runtime-packages.mjs --out "${runtime_package_root}"
          node scripts/package-native-hosts.mjs "dist/native" "${GITHUB_REF_NAME}"
          codex_archive="openlinker-codex-plugin-${GITHUB_REF_NAME}.tar.gz"
          claude_archive="openlinker-claude-plugin-${GITHUB_REF_NAME}.tar.gz"
          skills_archive="openlinker-skills-${GITHUB_REF_NAME}.tar.gz"
          codex_runtime_archive="openlinker-agent-runtime-codex-plugin-${GITHUB_REF_NAME}.tar.gz"
          claude_runtime_archive="openlinker-agent-runtime-claude-plugin-${GITHUB_REF_NAME}.tar.gz"
          codex_runtime_sbom="${codex_runtime_archive}.spdx.json"
          claude_runtime_sbom="${claude_runtime_archive}.spdx.json"
          tar -C dist/native/codex -czf "dist/${codex_archive}" openlinker
          tar -C dist/native/claude -czf "dist/${claude_archive}" openlinker
          tar -C shared -czf "dist/${skills_archive}" skills
          node scripts/create-deterministic-tar-gz.mjs \
            --root "${runtime_package_root}/codex-marketplace" \
            --out "dist/${codex_runtime_archive}"
          node scripts/create-deterministic-tar-gz.mjs \
            --root "${runtime_package_root}/claude-plugin/openlinker" \
            --prefix openlinker \
            --out "dist/${claude_runtime_archive}"
          node scripts/generate-agent-runtime-sbom.mjs \
            --root "${runtime_package_root}/codex-marketplace" \
            --name openlinker-agent-runtime-codex-plugin \
            --version "${GITHUB_REF_NAME}" \
            --out "dist/${codex_runtime_sbom}"
          node scripts/generate-agent-runtime-sbom.mjs \
            --root "${runtime_package_root}/claude-plugin/openlinker" \
            --name openlinker-agent-runtime-claude-plugin \
            --version "${GITHUB_REF_NAME}" \
            --out "dist/${claude_runtime_sbom}"
          (
            cd dist
            sha256sum "${codex_archive}" > "${codex_archive}.sha256"
            sha256sum "${claude_archive}" > "${claude_archive}.sha256"
            sha256sum "${skills_archive}" > "${skills_archive}.sha256"
            sha256sum "${codex_runtime_archive}" > "${codex_runtime_archive}.sha256"
            sha256sum "${claude_runtime_archive}" > "${claude_runtime_archive}.sha256"
            sha256sum "${codex_runtime_sbom}" > "${codex_runtime_sbom}.sha256"
            sha256sum "${claude_runtime_sbom}" > "${claude_runtime_sbom}.sha256"
          )

      - name: Attest Agent Runtime Plugin artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/openlinker-agent-runtime-codex-plugin-${{ github.ref_name }}.tar.gz
            dist/openlinker-agent-runtime-claude-plugin-${{ github.ref_name }}.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 dist/*.spdx.json --clobber
