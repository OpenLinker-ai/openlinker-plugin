name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: npm test
      - name: Check POSIX entrypoints
        run: |
          for host in codex claude; do
            sh -n "platforms/${host}/openlinker/bin/openlinker-plugin"
            sh -n "platforms/${host}/openlinker/scripts/resolve-openlinker-cli"
            sh -n "platforms/${host}/openlinker/scripts/install-openlinker-cli"
          done
      - name: Check Node entrypoints
        run: |
          for host in codex claude; do
            node --check "platforms/${host}/openlinker/scripts/install-openlinker-cli.mjs"
          done
          node --check scripts/generate-cli-lock.mjs

  validate-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/generate-codex-rpc.mjs --check
      - run: npm run test:go
      - name: Test pinned Codex tool execution without model credentials
        env:
          OPENLINKER_TEST_CODEX_RPC_LOCAL_MODEL: "1"
        run: |
          version=$(sed -n 's/^ARG CODEX_CLI_VERSION=//p' Dockerfile.providers)
          integrity=$(sed -n 's/^ARG CODEX_CLI_INTEGRITY=//p' Dockerfile.providers)
          test -n "$version" && test -n "$integrity"
          test "$(npm view "@openai/codex@$version" dist.integrity)" = "$integrity"
          npm install --global "@openai/codex@$version"
          GOWORK=off go test -count=1 -run '^TestInstalledCodexRPCWithLocalResponsesAPI$' ./packages/agent-adapters/agentexec
      - name: Test Provider identity isolation as root
        run: sudo env "PATH=$PATH" "GOCACHE=$RUNNER_TEMP/go-root-cache" "GOMODCACHE=$(go env GOMODCACHE)" GOWORK=off go test -count=1 -run '^(TestRPCHomePreparedUnderProviderIdentity|TestProviderPrivilegeDropBlocksAgentState)$' ./cmd/openlinker-provider-launcher
      - name: Test delegation across isolated Runtime and Provider identities
        run: sudo env "PATH=$PATH" "GOCACHE=$RUNNER_TEMP/go-root-cache" "GOMODCACHE=$(go env GOMODCACHE)" GOWORK=off go test -mod=readonly -count=1 -run '^TestBrokerCrossUIDProviderBoundary$' github.com/OpenLinker-ai/openlinker-agent-node/pkg/adapters/agentdelegation
      - run: npm run check:go-boundaries
      - run: npm run check:agent-runtime-integration
      - name: Build service entrypoints
        run: GOWORK=off go build ./cmd/...
      - name: Validate production image topology
        run: |
          docker compose --env-file deploy/.env.providers.example -f deploy/compose.providers.yml --profile codex --profile claude config >/dev/null
          docker compose --env-file deploy/.env.providers.example -f deploy/compose.codex.yml -f deploy/compose.codex.workspace-write.yml config >/dev/null
          docker compose --env-file deploy/.env.providers.example -f deploy/compose.claude.yml -f deploy/compose.claude.workspace-write.yml config >/dev/null
          docker compose --env-file deploy/.env.providers.example -f deploy/compose.codex.yml -f deploy/compose.codex.browser.yml config >/dev/null
          docker compose --env-file deploy/.env.providers.example -f deploy/compose.claude.yml -f deploy/compose.claude.browser.yml config >/dev/null

  validate-powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell entrypoints
        shell: pwsh
        run: |
          $files = @(
            "platforms/codex/openlinker/scripts/resolve-openlinker-cli.ps1",
            "platforms/codex/openlinker/scripts/install-openlinker-cli.ps1",
            "platforms/claude/openlinker/scripts/resolve-openlinker-cli.ps1",
            "platforms/claude/openlinker/scripts/install-openlinker-cli.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
