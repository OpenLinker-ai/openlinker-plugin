name: Provider images

on:
  pull_request:
    paths:
      - "Dockerfile.providers"
      - ".dockerignore"
      - "Dockerfile.browser"
      - "Dockerfile.browser.chrome"
      - "Dockerfile.browser.native-chrome"
      - "packages/browser-runtime/browser-engine/**"
      - "packages/browser-runtime/native-chrome/**"
      - "deploy/**"
      - "cmd/**"
      - "packages/**"
      - "test/browser-image/**"
      - "test/browser-provider-live/**"
      - "test/release-images/**"
      - "scripts/build-plugin-host.mjs"
      - "internal/pluginhost/**"
      - "scripts/build-agent-runtime-packages.mjs"
      - "scripts/resolve-agent-node-module.mjs"
      - "shared/skills/use-isolated-browser/**"
      - "platforms/claude/openlinker/commands/use-isolated-browser.md"
      - "package.json"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish compatible images from an existing immutable release tag
        required: true
        default: false
        type: boolean
      run_live_provider:
        description: Run credential-backed Codex and Claude Browser validation
        required: true
        default: false
        type: boolean
      providers:
        description: Provider images to validate and publish; Browser and Egress images are always included
        required: true
        default: codex claude
        type: choice
        options:
          - codex claude
          - codex
          - claude

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  browser-acceptance:
    name: Real Chromium no-bypass acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require an immutable tag and live gate for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RUN_LIVE_PROVIDER: ${{ inputs.run_live_provider }}
        run: test "$RELEASE_REF_TYPE" = tag && test "$RUN_LIVE_PROVIDER" = true
      - name: Self-test release evidence rejection
        run: ./test/release-images/verify.test.sh
      - name: Self-test credential-backed matrix verifier
        run: |
          sh -n ./test/browser-provider-live/run.sh
          sh -n ./test/browser-provider-live/matrix.sh
          node --test ./test/browser-provider-live/verify-results.test.mjs
      - name: Test native Chrome image and Native Messaging contracts
        run: node --test ./packages/browser-runtime/native-chrome/test/*.test.mjs ./test/browser-image/native-chrome-artifacts.test.mjs ./test/browser-image/native-chrome-image.test.mjs ./test/browser-image/fixture-readiness.test.mjs
      - name: Run deterministic production Browser and Egress images
        env:
          # Keep the asserted image platform explicit even though each acceptance
          # leg runs natively on the matching GitHub-hosted architecture.
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: ./test/browser-image/run.sh

  live-provider-acceptance:
    name: Credential-backed Codex and Claude Browser acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_provider
    needs: browser-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Prepare credential-backed Provider gate
        env:
          LIVE_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          LIVE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_PROVIDERS: ${{ inputs.providers }}
        run: |
          set -eu
          umask 077
          # Each selected Provider needs its own credential and both Browser modes.
          for provider in $LIVE_PROVIDERS; do
            case "$provider" in
              codex)
                test -n "$LIVE_CODEX_API_KEY" || { echo "CODEX_API_KEY secret is required" >&2; exit 1; }
                printf '%s\n' "$LIVE_CODEX_API_KEY" >"$RUNNER_TEMP/openlinker-codex-api-key"
                ;;
              claude)
                test -n "$LIVE_ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is required" >&2; exit 1; }
                printf '%s\n' "$LIVE_ANTHROPIC_API_KEY" >"$RUNNER_TEMP/openlinker-anthropic-api-key"
                ;;
              *) echo "unsupported Provider $provider" >&2; exit 1 ;;
            esac
          done
      - name: Run credential-backed Codex and Claude Browser matrix
        env:
          OPENLINKER_BROWSER_LIVE_CODEX_API_KEY_FILE: ${{ runner.temp }}/openlinker-codex-api-key
          OPENLINKER_BROWSER_LIVE_ANTHROPIC_API_KEY_FILE: ${{ runner.temp }}/openlinker-anthropic-api-key
          OPENLINKER_BROWSER_LIVE_EVIDENCE_FILE: ${{ runner.temp }}/browser-provider-live-evidence.jsonl
          OPENLINKER_BROWSER_LIVE_PROVIDERS: ${{ inputs.providers }}
          OPENLINKER_CODEX_BASE_URL: ${{ vars.OPENLINKER_CODEX_BASE_URL }}
          OPENLINKER_CODEX_MODEL: ${{ vars.OPENLINKER_CODEX_MODEL }}
          OPENLINKER_CLAUDE_MODEL: ${{ vars.OPENLINKER_CLAUDE_MODEL }}
        run: ./test/browser-provider-live/run.sh
      - name: Upload redacted Browser Provider evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-provider-live-evidence-${{ github.ref_name || github.run_id }}
          path: ${{ runner.temp }}/browser-provider-live-evidence.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Remove Provider credential files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/openlinker-codex-api-key" "$RUNNER_TEMP/openlinker-anthropic-api-key"

  images:
    # Source PRs exercise Browser/Egress without requiring a downstream CLI
    # release. Building compatible Provider images is a separate explicit gate.
    # Each architecture builds natively on its own runner (no emulation) and is
    # pushed by digest; publish-images assembles the multi-architecture tags.
    name: images (${{ matrix.target }}, ${{ matrix.arch }})
    needs: [browser-acceptance, live-provider-acceptance]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.browser-acceptance.result == 'success' && (needs.live-provider-acceptance.result == 'success' || !inputs.publish_images) }}
    runs-on: ${{ matrix.runner }}
    env:
      # Browser and Egress are always built; a Provider image is built and
      # published only when that Provider was selected and live-validated.
      BUILD_IMAGE: ${{ (matrix.target != 'codex' && matrix.target != 'claude') || contains(format(' {0} ', inputs.providers || 'codex claude'), format(' {0} ', matrix.target)) }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        target: [codex, claude, egress, browser]
        arch: [amd64, arm64]
        include:
          - target: codex
            image: openlinker-agent-codex
            dockerfile: Dockerfile.providers
          - target: claude
            image: openlinker-agent-claude
            dockerfile: Dockerfile.providers
          - target: egress
            image: openlinker-egress-gateway
            dockerfile: Dockerfile.providers
          - target: browser
            image: openlinker-browser-runtime
            dockerfile: Dockerfile.browser
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        if: env.BUILD_IMAGE == 'true'
      - uses: docker/setup-buildx-action@v4
        if: env.BUILD_IMAGE == 'true'
      - name: Require a native runner for the target architecture
        if: env.BUILD_IMAGE == 'true'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) native=amd64 ;;
            aarch64|arm64) native=arm64 ;;
            *) native=unknown ;;
          esac
          test "$native" = "$EXPECTED_ARCH" || { echo "runner is $native, not $EXPECTED_ARCH" >&2; exit 1; }
      - name: Log in to GHCR
        if: env.BUILD_IMAGE == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: env.BUILD_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openlinker-ai/${{ matrix.image }}
      - name: Build natively and optionally push by digest
        if: env.BUILD_IMAGE == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            OPENLINKER_PLUGIN_COMMIT=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/openlinker-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=providers-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=providers-${{ matrix.target }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
      - name: Record the pushed digest
        if: env.BUILD_IMAGE == 'true' && env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "missing pushed digest" >&2; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the pushed digest
        if: env.BUILD_IMAGE == 'true' && env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish multi-architecture ${{ matrix.target }} image
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    env:
      BUILD_IMAGE: ${{ (matrix.target != 'codex' && matrix.target != 'claude') || contains(format(' {0} ', inputs.providers || 'codex claude'), format(' {0} ', matrix.target)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: codex
            image: openlinker-agent-codex
          - target: claude
            image: openlinker-agent-claude
          - target: egress
            image: openlinker-egress-gateway
          - target: browser
            image: openlinker-browser-runtime
    steps:
      - name: Download both architecture digests
        if: env.BUILD_IMAGE == 'true'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
        if: env.BUILD_IMAGE == 'true'
      - name: Log in to GHCR
        if: env.BUILD_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: env.BUILD_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openlinker-ai/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Assemble the multi-architecture tags
        if: env.BUILD_IMAGE == 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/openlinker-ai/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          test "$(find . -type f | wc -l)" = 2 || { echo "expected one amd64 and one arm64 digest" >&2; exit 1; }
          sources=$(for digest in *; do printf '%s@sha256:%s ' "$IMAGE" "$digest"; done)
          tag_args=$(printf '%s\n' "$TAGS" | sed '/^$/d; s/^/-t /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args $sources
          docker buildx imagetools inspect "$(printf '%s\n' "$TAGS" | head -n 1)"

  verify-release-evidence:
    name: Verify release platforms, SBOM, and provenance
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref_type == 'tag'
    needs: publish-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published release evidence
        env:
          OPENLINKER_RELEASE_EVIDENCE_DIR: release-evidence
          OPENLINKER_RELEASE_PROVIDERS: ${{ inputs.providers }}
        run: |
          ./test/release-images/verify.sh \
            ghcr.io/openlinker-ai \
            "${GITHUB_REF_NAME}"
      - name: Upload the inspected release evidence
        uses: actions/upload-artifact@v7
        with:
          name: provider-release-evidence-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
